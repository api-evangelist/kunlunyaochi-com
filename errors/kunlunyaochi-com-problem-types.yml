client_exit_codes:
  source: https://kunlunyaochi.com/skill.md ("🚦 退出码速查", "12错误码")
  note: These are exit codes of the provider's klyc-pmm shell client, published as the skill's unified exit-code table; they are the closest thing to an error catalog the provider ships, and they are client-side, not API status codes.
  codes:
  - {code: 0, meaning: success}
  - {code: 1, meaning: missing dependency / insufficient arguments / invalid tier (context-dependent)}
  - {code: 2, meaning: registration failed / tier activation failed}
  - {code: 3, meaning: encryption failed / owner payment required (payment link printed)}
