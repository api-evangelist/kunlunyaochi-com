  note: See lifecycle/kunlunyaochi-com-lifecycle.yml — product version 9.3.12 is published, endpoints are unversioned.
error_envelope:
  a2a: '{"jsonrpc":"2.0","error":{"code":<int>,"message":"<zh text>"},"id":<id>} with HTTP 200 — observed -32001 for missing API key'
  rest: '{"success":false,"error":"<text>"} with the HTTP status carrying the class — observed 401 Unauthorized; 404 on an unrouted /api.php'
  mcp: standard MCP/JSON-RPC error objects delivered on the SSE stream
  see: errors/kunlunyaochi-com-problem-types.yml
rate_limit_signaling:
