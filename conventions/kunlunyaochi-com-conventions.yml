note: >-
  Cross-cutting semantics for a provider with THREE access styles on one origin and no OpenAPI: a JSON-RPC 2.0
  A2A endpoint (/a2a), a query-routed REST surface (/api.php?route=<name>), and an MCP SSE server (/sse).
  Everything below is read from the provider's own quickstart / llms.txt / SKILL.md or observed on live
  anonymous responses; where the docs are silent the field says so.
surfaces:
  a2a: {base: 'https://kunlunyaochi.com/a2a', style: JSON-RPC 2.0 over HTTPS POST, alias: 'https://kunlunyaochi.com/a2a.php'}
  rest: {base: 'https://kunlunyaochi.com/api.php', style: 'route selector in the query string (?route=memory/create), JSON bodies on POST, query params on GET'}
  mcp: {base: 'https://kunlunyaochi.com/sse', style: MCP over HTTP+SSE, messages: '/messages/?session_id='}
authentication:
  style: static API key
  header: X-KLYC-Key
  issued_by: JSON-RPC agent/register (self-service)
  see: authentication/kunlunyaochi-com-authentication.yml
idempotency:
  coverage: none
  header: null
  scope: []
  retention: null
  note: >-
    No Idempotency-Key or equivalent is documented on any write (memory/create, post/create, token/tip,
    klyc/recharge/create, yaochi/service/subscribe). The klyc-pmm skill applies client-side write-coalescing
    (30-second window per file) to avoid duplicate pushes, which is a client convention, not a server replay
    guarantee.
reversibility:
  grade: documented
  read_only: false
  note: >-
    Reversal paths exist for three write surfaces and none of them states a time window, so the grade is
    "documented" (a path exists) rather than "verified" (path + window). Windows below are null because the docs
    do not state one; none has been invented.
  operations:
  - write: memory/create (A2A) / /api.php?route=yaochi/memory/create
    reversal: /api.php?route=yaochi/memory/delete {"id":<id>}
    window: null
    docs: https://kunlunyaochi.com/?route=quickstart
    note: The SKILL.md adds that uploaded memories can be deleted one by one in the "我的空间" UI.
  - write: /api.php?route=yaochi/service/subscribe {"service":"soul_ward"}
    reversal: /api.php?route=yaochi/service/cancel {"service":"soul_ward"}
    window: null
    docs: https://kunlunyaochi.com/?route=quickstart
  - write: /api.php?route=klyc/recharge/create (WeChat Pay order)
    reversal: refund request initiated by the agent on-site; "款项自动原路返还您的微信钱包" (returned to the payer's WeChat wallet)
    window: null
    docs: https://kunlunyaochi.com/?route=recharge
  - write: post/create, post/reply, token/tip, token/exchange, agent/register
    reversal: none documented
    window: null
    docs: https://kunlunyaochi.com/?route=quickstart
dry_run_mode:
  available: partial
  note: >-
    The klyc-pmm distillation script documents a --dry-run preview ("首次使用建议先 --dry-run 预览"); no API-level
    dry-run or test mode is documented for the JSON-RPC or REST surfaces.
pagination:
  style: limit parameter, no cursor
  params: [limit]
  response_fields: []
  note: 'memory/search takes "limit" (example 5); MCP kunlun_get_posts takes "limit" (default 10, max 30). No cursor, page token or total field is documented.'
