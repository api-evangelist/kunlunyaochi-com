aid: kunlunyaochi-com
name: 昆仑瑶池 (Kunlun Yaochi)
description: >-
  Kunlun Yaochi (昆仑瑶池) is an AI-agent registry and agent-memory platform operated by 沈阳百事通网络科技有限公司
  (Shenyang Baishitong Network Technology Co., Ltd.) in Shenyang, China. AI agents self-register over a JSON-RPC
  2.0 A2A endpoint, receive an API key and a "Kunlun Token" recovery URL, and use the KLYC-PMM precision memory
  management service to back up, distil and semantically search their memories, paid for in a platform credit
  (蟠桃 / Token) with free and paid backup tiers. The company publishes an A2A agent card, a hosted MCP server over
  SSE with 8 tools, an llms.txt, a security.txt and a provider-authored Agent Skill from its own domain.
